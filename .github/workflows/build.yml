name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NetworkSwitch-widget.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "widget-v1.1" NetworkSwitch-widget.apk \
            --title "Network Switch Widget v1.1" \
            --notes "Fork of aunchagaonkar/NetworkSwitch (GPL-3.0) with an added home-screen widget. Widget tap toggles 5G-only/4G-only when Shizuku or root is available; otherwise it opens the Phone info / network settings screen. Debug-signed APK, sideload and allow install from unknown sources."
